apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: pune-api-hpa
  namespace: pune-api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: pune-api
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70    # Scale up when CPU > 70%
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80    # Scale up when memory > 80%
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60     # Wait 60s before scaling up again
      policies:
        - type: Pods
          value: 2
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300    # Wait 5min before scaling down
      policies:
        - type: Pods
          value: 1
          periodSeconds: 120
