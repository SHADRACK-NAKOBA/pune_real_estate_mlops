apiVersion: apps/v1
kind: Deployment
metadata:
  name: pune-api
  namespace: pune-api
  labels:
    app: pune-api
    version: v1.0.0
spec:
  replicas: 3
  selector:
    matchLabels:
      app: pune-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0        # Never go below 3 pods during update (zero downtime)
  template:
    metadata:
      labels:
        app: pune-api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "8000"
    spec:
      containers:
        - name: pune-api
          # Replace AWS_ACCOUNT_ID and AWS_REGION with real values,
          # or let GitHub Actions patch this via kubectl set image.
          image: AWS_ACCOUNT_ID.dkr.ecr.us-east-1.amazonaws.com/pune-real-estate-api:latest
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: pune-api-config
            - secretRef:
                name: pune-api-secret
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 3
