name: CI/CD Pipeline — Pune Real Estate API

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  DOCKER_IMAGE: ${{ secrets.DOCKER_USERNAME }}/pune-real-estate-api

jobs:
  # ─────────────────────────────────────────────────────────────
  # JOB 1: Run Tests
  # ─────────────────────────────────────────────────────────────
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Cache pip packages
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install core dependencies only (skip heavy ML libs for speed)
        run: |
          python -m pip install --upgrade pip
          pip install fastapi uvicorn pydantic joblib numpy pandas pytest httpx

      - name: Run tests
        run: |
          if [ -d "tests" ] && [ "$(ls -A tests/)" ]; then
            pytest tests/ -v --tb=short
          else
            echo "No tests found — skipping (add tests to tests/ directory)"
          fi

  # ─────────────────────────────────────────────────────────────
  # JOB 2: Build and Push Docker Image to Docker Hub
  # ─────────────────────────────────────────────────────────────
  build:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    outputs:
      sha_tag: ${{ steps.meta.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract Docker metadata (tags and labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_IMAGE }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deployment/docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Print image tags
        run: echo "Pushed image tags ${{ steps.meta.outputs.tags }}"

  # ─────────────────────────────────────────────────────────────
  # JOB 3: Deploy to AWS EC2
  # ─────────────────────────────────────────────────────────────
  deploy-ec2:
    name: Deploy to AWS EC2
    runs-on: ubuntu-latest
    needs: build
    if: |
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push' &&
      secrets.EC2_HOST != ''
    environment: production
    steps:
      - name: Deploy new image via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          timeout: 120s
          script: |
            set -e

            IMAGE="${{ env.DOCKER_IMAGE }}:latest"

            echo "Pulling latest image: $IMAGE"
            docker pull $IMAGE

            echo "Stopping old container (if running)..."
            docker stop pune_api 2>/dev/null || true
            docker rm pune_api 2>/dev/null || true

            echo "Starting new container..."
            docker run -d \
              --name pune_api \
              --restart unless-stopped \
              -p 8000:8000 \
              -e APP_ENV=production \
              $IMAGE

            echo "Waiting for container to become healthy..."
            sleep 35

            echo "Health check..."
            curl -f http://localhost:8000/health || (docker logs pune_api && exit 1)

            echo "Cleaning up old images..."
            docker image prune -f

            echo "Deployment complete."

      - name: Verify deployment from GitHub Actions runner
        run: |
          sleep 10
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://${{ secrets.EC2_HOST }}/health)
          if [ "$STATUS" = "200" ]; then
            echo "API is live and healthy at http://${{ secrets.EC2_HOST }}/docs"
          else
            echo "Health check returned HTTP $STATUS — deployment may have failed"
            exit 1
          fi

  # ─────────────────────────────────────────────────────────────
  # JOB 4: Deploy to AWS ECS Fargate (runs when AWS secrets present)
  # ─────────────────────────────────────────────────────────────
  deploy-ecs:
    name: Deploy to AWS ECS Fargate
    runs-on: ubuntu-latest
    needs: build
    if: |
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push' &&
      secrets.AWS_ACCESS_KEY_ID != ''
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Pull Docker Hub image and push to ECR
        run: |
          ECR_IMAGE="${{ steps.login-ecr.outputs.registry }}/pune-real-estate-api:latest"
          docker pull ${{ env.DOCKER_IMAGE }}:latest
          docker tag ${{ env.DOCKER_IMAGE }}:latest $ECR_IMAGE
          docker push $ECR_IMAGE
          echo "ECR_IMAGE=$ECR_IMAGE" >> $GITHUB_ENV

      - name: Force new ECS deployment
        run: |
          aws ecs update-service \
            --cluster pune-api-cluster \
            --service pune-api-service \
            --force-new-deployment \
            --region ap-south-1

      - name: Wait for ECS service to stabilize
        run: |
          aws ecs wait services-stable \
            --cluster pune-api-cluster \
            --services pune-api-service \
            --region ap-south-1
          echo "ECS deployment stable."
